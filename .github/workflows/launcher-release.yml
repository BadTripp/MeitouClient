# Manual launcher release: publishes launcher/Meitou.Launcher self-contained for each platform, tags the commit launcher-v<version> and
# publishes a GitHub release with MeitouLauncher-<version>-<rid>.zip, never marked Latest (that stays the game's). docs/launcher.md.
name: Launcher release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Launcher version without the v, e.g. 0.1.0"
        required: true
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="${INPUT_VERSION#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "bad version '$v'"; exit 1; }
          [ -z "$(git tag -l "launcher-v$v")" ] || { echo "tag launcher-v$v already exists"; exit 1; }
          # The version's launcher/CHANGELOG.md section (from "## v<version>" to the next "## "): required.
          awk -v h="## v$v" '$0==h{f=1;next} /^## /{f=0} f' launcher/CHANGELOG.md > "$RUNNER_TEMP/changes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/changes.md" || { echo "launcher/CHANGELOG.md has no non-empty '## v$v' section"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out
          for rid in win-x64 linux-x64 osx-x64 osx-arm64; do
            dotnet publish launcher/Meitou.Launcher -c Release -r "$rid" --self-contained \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version="$VERSION" -o "pub/$rid"
            (cd "pub/$rid" && zip -qr "../../out/MeitouLauncher-$VERSION-$rid.zip" .)
          done

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          {
            echo "## Launcher v$VERSION"; echo; cat "$RUNNER_TEMP/changes.md"; echo
            echo "## Download"; echo
            echo "Pick the zip for your system (win-x64, linux-x64, osx-x64 for Intel Macs, osx-arm64 for Apple silicon), unzip it and run meitou-launcher."
            echo "It installs game releases and edits the mod list; you need Kenshi installed. macOS builds are not signed yet."
          } > "$RUNNER_TEMP/notes.md"
          flags=(--latest=false)
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          previous=$(git tag -l "launcher-v*" --sort=-v:refname | head -n1)
          [ -n "$previous" ] && flags+=(--generate-notes --notes-start-tag "$previous")
          gh release create "launcher-v$VERSION" out/*.zip --target "$GITHUB_SHA" \
            --title "Meitou Launcher $VERSION" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
